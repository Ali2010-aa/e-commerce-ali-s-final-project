<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVerse | SignUp</title>
    <link rel="website icon" type="png" href="./images/logo.png" />
    <link rel="stylesheet" href="./signUp.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <video autoplay muted loop id="bg-video">
      <source src="./videos/backgroundVideo.mp4" type="video/mp4" />
    </video>
    <div class="signup-box">
      <h2>Join GameVerse</h2>
      <form class="was-validated">
        <input
          type="text"
          id="userName"
          class="form-control"
          placeholder="UserName"
          required
        />
        <div class="invalid-feedback">Don't leave empty!</div>
        <div class="valid-feedback">Everything is true!</div>
        <input
          type="email"
          class="form-control"
          id="email"
          placeholder="Email"
          required
        />
        <input
          type="password"
          id="password"
          class="form-control"
          placeholder="Password"
          required
        />
        <input
          type="password"
          class="form-control"
          id="confirmPassword"
          placeholder="Confirm Password"
          required
        />
        <button type="submit" id="signUpBtn">Sign Up</button>
      </form>
      <p>
        Do you have an account?
        <a href="#">Log In</a></p>
    </div>
    <script>
      let userName = document.querySelector("#userName");
      let email = document.querySelector("#email");
      let password = document.querySelector("#password");
      let rePassword = document.querySelector("#confirmPassword");
      let signUpBtn = document.querySelector("#signUpBtn");

      let users = [];
      let usersString = localStorage.getItem("users");
      if (usersString) {
        users = JSON.parse(usersString);
      }

      signUpBtn.addEventListener("click", function (e) {
        e.preventDefault();
        let username = userName.value;
        let userEmail = email.value;
        let userPassword = password.value;
        let userConfirmPassword = confirmPassword.value;
        let userExists = false;

        for (let i = 0; i < users.length; i++) {
          if (users[i].email === userEmail) {
            userExists = true;
            break;
          }
        }

        if (userExists) {
          alert("This email is already registered. Please log in.");
        } else if (userPassword !== userConfirmPassword) {
          alert("Passwords do not match. Please try again.");
        } else {
          let userId = 0;
          for (let i = 0; i < users.length; i++) {
            if (users[i].id > userId) {
              userId = users[i].id;
            }
          }
          userId++;

          let user = {
            id: userId,
            name: username,
            email: userEmail,
            password: userPassword,
          };
          users.push(user);
          localStorage.setItem("users", JSON.stringify(users));
          alert("Registration successful! You can now log in.");
          userName.value = "";
          email.value = "";
          password.value = "";
          confirmPassword.value = "";
          window.location.href = "login.html";
        }
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVerse | main</title>
    <link rel="website icon" type="png" href="/images/logo.png" />
    <link rel="stylesheet" href="/css/mainPage.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <nav id="navbar">
      <a class="navbar-brand" href="/html/mainPage.html"
        ><i class="fa-solid fa-gamepad"></i>GameVerse</a
      >
      <a class="navUserLogo">
        <i class="fa-regular fa-circle-user"></i>
      </a>
    </nav>
    <div class="user-section">
      <i class="fa-regular fa-circle-user" id="userLogo"></i>
      <span class="username"></span>
      <span class="userId"></span>
      <span class="userMail"></span>
      <button class="btn btn-outline-success btn-sm" id="addGameBtn">
        Add Game
      </button>
      <button class="btn btn-outline-info btn-sm" id="myGamesBtn">
        My Games
      </button>
      <button class="btn btn-outline-danger btn-sm logOutBtn">Log Out</button>
    </div>
    <div class="sales">
      <div class="sidebar">
        <h3>Categories</h3>
        <ul class="categories-list">
          <li class="category-item all" data-category="all">All</li>
          <li class="category-item action" data-category="action">Action</li>
          <li class="category-item adventure" data-category="adventure">
            Adventure
          </li>
          <li class="category-item rpg" data-category="rpg">RPG</li>
          <li class="category-item strategy" data-category="strategy">
            Strategy
          </li>
          <li class="category-item sports" data-category="sports">Sports</li>
        </ul>
      </div>
      <div class="games-container">
        <h1>Games</h1>
        <div class="games-list"></div>
      </div>
    </div>
   <div class="scroll-top" id="scrollTopBtn">↑</div>
    <div
      class="modal fade"
      id="gameBuyModal"
      tabindex="-1"
      aria-labelledby="gameBuyModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="gameBuyModalLabel">Modal title</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">...</div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-danger"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-outline-success modalBuyBtn">
              Buy
            </button>
          </div>
        </div>
      </div>
    </div>
    <div
      class="modal fade"
      id="addGameModal"
      tabindex="-1"
      aria-labelledby="addGameModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="addGameModalLabel">
              Add New Game
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addGameForm">
              <div class="mb-3">
                <label class="form-label">Game Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="gameNameInput"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Image URL</label>
                <input
                  type="text"
                  class="form-control"
                  id="gameImageInput"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Price</label>
                <input
                  type="text"
                  class="form-control"
                  id="gamePriceInput"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Genre</label>
                <select class="form-select" id="gameGenreInput" required>
                  <option value="">Select Genre</option>
                  <option value="Action">Action</option>
                  <option value="Adventure">Adventure</option>
                  <option value="RPG">RPG</option>
                  <option value="Strategy">Strategy</option>
                  <option value="Sports">Sports</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-primary" id="saveGameBtn">
              Add Game
            </button>
          </div>
        </div>
      </div>
    </div>
    <div
      class="modal fade"
      id="myGamesModal"
      tabindex="-1"
      aria-labelledby="myGamesModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="myGamesModalLabel">
              My Added Games
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <table class="table table-striped" id="myGamesTable">
              <thead>
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">Game Name</th>
                  <th scope="col">Image</th>
                  <th scope="col">Price</th>
                  <th scope="col">Genre</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/javaScript/mainPage.js"></script>
  </body>
</html>

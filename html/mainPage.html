<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVerse | main</title>
    <link rel="website icon" type="png" href="/images/logo.png" />
    <link rel="stylesheet" href="/css/mainPage.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <nav id="navbar">
      <a class="navbar-brand" href="/html/mainPage.html"
        ><i class="fa-solid fa-gamepad"></i>GameVerse</a
      >
      <a class="navUserLogo">
        <i class="fa-regular fa-circle-user"></i>
      </a>
    </nav>
    <div class="user-section">
      <i class="fa-regular fa-circle-user" id="userLogo"></i>
      <span class="username"></span>
      <span class="userId"></span>
      <span class="userMail"></span>
      <button class="btn btn-outline-danger btn-sm">Log Out</button>
    </div>
    <div class="sales">
      <div class="sidebar">
        <h3>Categories</h3>
        <ul class="categories-list">
          <li class="category-item all" data-category="all">All</li>
          <li class="category-item action" data-category="action">Action</li>
          <li class="category-item adventure" data-category="adventure">
            Adventure
          </li>
          <li class="category-item rpg" data-category="rpg">RPG</li>
          <li class="category-item strategy" data-category="strategy">
            Strategy
          </li>
          <li class="category-item sports" data-category="sports">Sports</li>
        </ul>
      </div>
      <div class="games-container">
        <h1>Games</h1>
        <div class="games-list">
        </div>
      </div>
    </div>
    <div class="backTop">
      <div></div>
      <a class="backTopLogo" href="#navbar">
        <i class="fa-solid fa-angle-up"></i>
      </a>
    </div>

    <script src="/javaScript/mainPage.js"></script>
  </body>
</html>
